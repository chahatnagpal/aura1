<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — LaVIDA | Restaurant Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/admin.css">

  <script src="js/env.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="admin-body">

  <div class="admin-layout">
    
    <!-- Sidebar Navigation -->
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="admin-sidebar-header">
        <div class="brand-logo">
          <div class="logo-icon">🔥</div>
          <span>La<span class="logo-accent">VIDA</span></span>
        </div>
        <span class="badge badge-secondary" style="font-size:0.65rem;">ADMIN</span>
      </div>

      <nav class="admin-nav">
        <a class="admin-nav-item active" data-tab="overview">
          <span>📊</span> Overview & KPIs
        </a>
        <a class="admin-nav-item" data-tab="orders">
          <span>🛍️</span> Live Orders
        </a>
        <a class="admin-nav-item" data-tab="products">
          <span>🍔</span> Products Catalog
        </a>
        <a class="admin-nav-item" data-tab="categories">
          <span>📁</span> Categories
        </a>
      </nav>

      <div class="admin-sidebar-footer">
        <a href="index.html" class="btn btn-outline btn-sm" style="width:100%; color:white; border-color:var(--color-dark-700);">
          ← View Customer Store
        </a>
      </div>
    </aside>

    <!-- Main Admin View Area -->
    <div class="admin-main">
      
      <!-- Topbar -->
      <header class="admin-topbar">
        <div style="display:flex; align-items:center; gap:12px;">
          <button class="mobile-toggle" id="adminSidebarToggle" style="display:none;" aria-label="Toggle Sidebar">
            ☰
          </button>
          <h2 class="admin-page-title">Restaurant Management Hub</h2>
        </div>

        <div class="admin-topbar-actions">
          <button class="btn btn-outline btn-sm" onclick="window.LaVIDAUI.openSupabaseSettings()">
            ⚡ Supabase Backend
          </button>
          <div style="display:flex; align-items:center; gap:8px;">
            <div class="user-avatar" style="width:34px; height:34px;">A</div>
            <div class="text-xs">
              <strong id="adminUserName" style="display:block;">Admin</strong>
              <span class="text-muted">Administrator</span>
            </div>
          </div>
        </div>
      </header>

      <!-- Content Views (Injected dynamically by js/admin.js) -->
      <main class="admin-content-view" id="adminContentView">
        <!-- Dynamic content: Overview, Products, Categories, Orders -->
        <div class="skeleton skeleton-card" style="height:120px; margin-bottom:24px;"></div>
        <div class="skeleton skeleton-card" style="height:360px;"></div>
      </main>

    </div>
  </div>

  <script type="module">
    import { initAdminDashboard } from './js/admin.js';

    document.addEventListener('DOMContentLoaded', () => {
      initAdminDashboard();

      // Mobile sidebar toggle
      const sidebar = document.getElementById('adminSidebar');
      const toggle = document.getElementById('adminSidebarToggle');
      if (toggle && sidebar) {
        toggle.addEventListener('click', () => {
          sidebar.classList.toggle('open');
        });
      }
    });
  </script>
</body>
</html>
