<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In / Register — LaVIDA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">

  <script src="js/env.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Minimal Header -->
  <header class="site-header">
    <div class="container header-container">
      <a href="index.html" class="brand-logo">
        <div class="logo-icon">🔥</div>
        <span>La<span class="logo-accent">VIDA</span></span>
      </a>
      <a href="index.html" class="btn btn-outline btn-sm">← Back to Store</a>
    </div>
  </header>

  <main class="section-padding">
    <div class="container">
      <div class="auth-wrapper">
        
        <!-- Brand Header -->
        <div class="text-center" style="margin-bottom: 24px;">
          <div class="brand-logo" style="justify-content:center; margin-bottom:8px;">
            <div class="logo-icon">🔥</div>
            <span>La<span class="logo-accent">VIDA</span></span>
          </div>
          <p class="text-xs text-muted">Good food. No complicated decisions.</p>
        </div>

        <!-- Auth Tabs -->
        <div class="auth-tabs">
          <button class="auth-tab active" id="tabBtnLogin">Sign In</button>
          <button class="auth-tab" id="tabBtnRegister">Create Account</button>
        </div>

        <!-- SIGN IN FORM -->
        <form id="loginForm">
          <div class="form-group">
            <label class="form-label" for="loginEmail">Email Address</label>
            <input type="email" id="loginEmail" class="form-input" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="loginPassword">Password</label>
            <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn btn-primary btn-lg" style="width:100%; margin-top:12px;" id="btnLoginSubmit">
            Sign In to Account
          </button>
        </form>

        <!-- REGISTER FORM -->
        <form id="registerForm" style="display: none;">
          <div class="form-group">
            <label class="form-label" for="regFullName">Full Name *</label>
            <input type="text" id="regFullName" class="form-input" placeholder="Alex Rivera" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="regEmail">Email Address *</label>
            <input type="email" id="regEmail" class="form-input" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="regPhone">Phone Number *</label>
            <input type="tel" id="regPhone" class="form-input" placeholder="+1 (555) 019-2834" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="regPassword">Create Password (Min 6 chars) *</label>
            <input type="password" id="regPassword" class="form-input" minlength="6" placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn btn-primary btn-lg" style="width:100%; margin-top:12px;" id="btnRegSubmit">
            Create Free Account
          </button>
        </form>

        <!-- Demo Quick Login Helper -->
        <div style="margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--color-light-200); text-align: center;">
          <span class="text-xs text-muted" style="display:block; margin-bottom: 10px;">⚡ Quick Demo Accounts:</span>
          <div style="display:flex; gap:8px; justify-content:center;">
            <button class="btn btn-outline btn-sm" id="btnFillDemoCustomer">👤 Customer Demo</button>
            <button class="btn btn-secondary btn-sm" id="btnFillDemoAdmin">👑 Admin Demo</button>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script type="module">
    import { signIn, signUp, getCurrentUser } from './js/auth.js';
    import { showToast } from './js/ui.js';

    const urlParams = new URLSearchParams(window.location.search);
    const returnUrl = urlParams.get('returnUrl') || 'index.html';

    // Tab switching
    const tabLogin = document.getElementById('tabBtnLogin');
    const tabRegister = document.getElementById('tabBtnRegister');
    const formLogin = document.getElementById('loginForm');
    const formRegister = document.getElementById('registerForm');

    tabLogin.addEventListener('click', () => {
      tabLogin.classList.add('active');
      tabRegister.classList.remove('active');
      formLogin.style.display = 'block';
      formRegister.style.display = 'none';
    });

    tabRegister.addEventListener('click', () => {
      tabRegister.classList.add('active');
      tabLogin.classList.remove('active');
      formRegister.style.display = 'block';
      formLogin.style.display = 'none';
    });

    // Login submit
    formLogin.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('btnLoginSubmit');

      btn.disabled = true;
      btn.textContent = 'Authenticating...';

      try {
        await signIn({ email, password });
        showToast('Signed in successfully! Welcome back.', 'success');
        setTimeout(() => {
          window.location.href = returnUrl;
        }, 500);
      } catch (err) {
        showToast(err.message, 'danger');
        btn.disabled = false;
        btn.textContent = 'Sign In to Account';
      }
    });

    // Register submit
    formRegister.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fullName = document.getElementById('regFullName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const password = document.getElementById('regPassword').value;
      const btn = document.getElementById('btnRegSubmit');

      btn.disabled = true;
      btn.textContent = 'Creating account...';

      try {
        await signUp({ fullName, email, phone, password });
        showToast('Account created successfully! 🎉', 'success');
        setTimeout(() => {
          window.location.href = returnUrl;
        }, 500);
      } catch (err) {
        showToast(err.message, 'danger');
        btn.disabled = false;
        btn.textContent = 'Create Free Account';
      }
    });

    // Demo Fillers
    document.getElementById('btnFillDemoCustomer')?.addEventListener('click', () => {
      tabLogin.click();
      document.getElementById('loginEmail').value = 'customer@eatlavida.com';
      document.getElementById('loginPassword').value = 'password123';
      showToast('Demo customer credentials filled!', 'info');
    });

    document.getElementById('btnFillDemoAdmin')?.addEventListener('click', () => {
      tabLogin.click();
      document.getElementById('loginEmail').value = 'admin@eatlavida.com';
      document.getElementById('loginPassword').value = 'adminpass123';
      showToast('Demo admin credentials filled!', 'info');
    });

    // Check if already signed in
    getCurrentUser().then(user => {
      if (user) {
        window.location.href = returnUrl;
      }
    });
  </script>
</body>
</html>
